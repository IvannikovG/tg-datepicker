<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Выбор даты</title>
<style>
  :root {
    --bg:#0f1115;
    --fg:#eaeef5;
    --accent:#6ee7ff;
    --muted:#7a8599;
    --ring:rgba(110,231,255,.28);
    --active-glow:rgba(110,231,255,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  }

  .wrap{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;      /* ближе к верху */
    gap:10px;                        /* чуть меньше расстояние между блоками */
    padding:18px 16px 16px;          /* больше отступ сверху, но не огромный */
  }

  h1{
    font-size:18px;
    font-weight:600;
    margin:0;
    opacity:.92;
  }

  .wheels{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .col{
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .label{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    margin-top:6px;
  }

  /* КРУТИЛКИ: поуже и подлиннее */
  .wheel{
    width:88px;                       /* было 110px */
    height:224px;                     /* было 192px */
    padding:0 4px;                    /* было 0 6px */
    overflow-y:auto;
    scrollbar-width:none;
    -ms-overflow-style:none;
    border-radius:14px;
    position:relative;
    z-index:0;
    backdrop-filter:saturate(120%) blur(.3px);
    background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));
    box-shadow:0 0 0 1px rgba(255,255,255,.05) inset,0 10px 44px rgba(0,0,0,.5);
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    overscroll-behavior: contain;
    pointer-events: auto;
    contain: content;
  }
  .wheel::-webkit-scrollbar{display:none}

  .wheel::after{
    display: none;
  }

  .fade-top,.fade-bot{
    position:absolute;
    left:0;right:0;
    height:36px;
    pointer-events:none;
    z-index:1;
  }
  .fade-top{
    top:0;
    background:linear-gradient(180deg,rgba(15,17,21,.85),rgba(15,17,21,0));
  }
  .fade-bot{
    bottom:0;
    background:linear-gradient(0deg,rgba(15,17,21,.85),rgba(15,17,21,0));
  }

  .spacer{height:72px}

  .item{
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:var(--muted);
    transition:
      transform .08s linear,
      opacity .08s linear,
      color .08s linear,
      text-shadow .08s linear;
    will-change:transform,opacity;
  }
  .item.active{
    color:var(--fg);
    font-weight:800;
    opacity:1;
    transform:scale(1.13);
    text-shadow:0 0 10px var(--active-glow),0 0 22px rgba(0,0,0,.4);
    position:relative;
  }
  .item.active::before{
    content:"";
    position:absolute;
    left:8px;
    right:8px;
    height:36px;
    border-radius:8px;
    z-index:-1;
    background:linear-gradient(135deg,rgba(56,189,248,.26),rgba(139,92,246,.22) 80%);
    box-shadow:
      0 6px 20px rgba(56,189,248,.22),
      0 3px 10px rgba(139,92,246,.18);
    pointer-events:none;
  }
  .item.dim-1{opacity:.75}
  .item.dim-2{opacity:.55;transform:scale(.98)}
  .item.dim-3{opacity:.38;transform:scale(.95)}

  .value{
    font-size:14px;
    color:var(--muted);
  }
  .value strong{
    color:var(--fg);
  }

  .btn{
    padding:14px 18px;
    border-radius:12px;
    border:none;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    background:linear-gradient(135deg,#38bdf8,#8b5cf6 80%);
    box-shadow:
      0 10px 30px rgba(56,189,248,.35),
      0 4px 14px rgba(139,92,246,.25);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Выбери дату</h1>
  <div class="wheels">
    <div class="col">
      <div class="wheel" id="wheel-day">
        <div class="fade-top"></div><div class="fade-bot"></div>
        <div class="spacer"></div><div class="spacer"></div>
      </div>
      <div class="label">День</div>
    </div>
    <div class="col">
      <div class="wheel" id="wheel-month">
        <div class="fade-top"></div><div class="fade-bot"></div>
        <div class="spacer"></div><div class="spacer"></div>
      </div>
      <div class="label">Месяц</div>
    </div>
    <div class="col">
      <div class="wheel" id="wheel-year">
        <div class="fade-top"></div><div class="fade-bot"></div>
        <div class="spacer"></div><div class="spacer"></div>
      </div>
      <div class="label">Год</div>
    </div>
  </div>
  <div class="value" id="val">Выбрано: <strong>—</strong></div>
  <button class="btn" id="send">Готово</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  const tg = window.Telegram.WebApp || {};
  const tp = tg.themeParams || {};
  const css = (k,v)=>document.documentElement.style.setProperty(k,v);
  css('--bg', tp.bg_color || '#0f1115');
  css('--fg', tp.text_color || '#eaeef5');
  css('--muted', tp.hint_color || '#7a8599');
  css('--accent', tp.button_color || '#6ee7ff');

  const H = 48;
  const CENTER_PAD = 72;

  function buildWheel(el, items, selectedIdx = 0, onChange = ()=>{}) {
    const spacers = el.querySelectorAll('.spacer');
    const after = spacers[1];

    // очищаем старые
    el.querySelectorAll('.item').forEach(n=>n.remove());

    // вставляем элементы
    const frag = document.createDocumentFragment();
    for (const v of items){
      const d = document.createElement('div');
      d.className = 'item';
      d.textContent = v;
      frag.appendChild(d);
    }
    el.insertBefore(frag, after);

    const itemsEls = ()=>Array.from(el.querySelectorAll('.item'));

    const centerY = (node)=> {
      const r = node.getBoundingClientRect();
      return r.top + r.height/2;
    };
    const wheelCenterY = ()=> {
      const r = el.getBoundingClientRect();
      return r.top + r.height/2;
    };

    function nearestIndex(){
      const center = wheelCenterY();
      let bestI = 0, bestD = Infinity;
      itemsEls().forEach((it, i)=>{
        const d = Math.abs(centerY(it) - center);
        if (d < bestD){ bestD = d; bestI = i; }
      });
      return bestI;
    }
    function scrollTopForIndex(i){
      const firstTop = CENTER_PAD;
      const centerOfItem = firstTop + i*H + H/2;
      return centerOfItem - el.clientHeight/2;
    }

    function paintActive(){
      const center = wheelCenterY();
      itemsEls().forEach((it)=>{
        it.classList.remove('active','dim-1','dim-2','dim-3');
        const d = Math.abs(centerY(it) - center);
        if (d < H/2){ it.classList.add('active'); }
        else if (d < H*1){ it.classList.add('dim-1'); }
        else if (d < H*2){ it.classList.add('dim-2'); }
        else { it.classList.add('dim-3'); }
      });
    }

    let settleTimer=null, lastI=-1, userScroll=false;

    function snapTo(i, smooth=true){
      const top = scrollTopForIndex(i);
      const doSmooth = smooth && !userScroll; // не анимируем в фазе жеста
      if (doSmooth) el.scrollTo({top, behavior:'smooth'});
      else el.scrollTop = top;
      paintActive();
    }

    function onScroll(){
      userScroll = true;
      paintActive();
      clearTimeout(settleTimer);
      settleTimer = setTimeout(()=>{
        userScroll = false;
        const i = nearestIndex();
        // финальный доклик — без smooth (WebKit стабильнее)
        snapTo(i, false);
        if (i !== lastI){
          lastI = i;
          tg.HapticFeedback?.impactOccurred?.("light");
          onChange(i);
        }
      }, 120);
    }

    // init
    snapTo(selectedIdx, false);
    lastI = selectedIdx;
    // ВАЖНО: НЕ вызывать onChange здесь — это ломает порядок инициализации снаружи
    el.addEventListener('scroll', onScroll, {passive:true});

    // защита от перерисовок/ресайза WebView
    const ro = new ResizeObserver(()=>{
      paintActive();
      snapTo(nearestIndex(), false);
    });
    ro.observe(el);

    // иногда помогает, чтобы скролл не всплывал к родителю
    el.addEventListener('wheel', (e)=>{ e.stopPropagation(); }, {passive:true});

    return {
      getIndex: ()=>nearestIndex(),
      snapTo
    };
  }

  // данные
  const days   = Array.from({length:31},(_,i)=>String(i+1).padStart(2,'0'));
  const months = ["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
  const thisYear = new Date().getFullYear();
  const years  = Array.from({length:110},(_,i)=>String(thisYear-i));

  // элементы
  const elDay = document.getElementById('wheel-day');
  const elMon = document.getElementById('wheel-month');
  const elYear= document.getElementById('wheel-year');

  // безопасная инициализация
  let ready = false;

  function clampDay(){
    const y = +years[wYear.getIndex()];
    const mIdx = wMon.getIndex();
    const max = new Date(y, mIdx+1, 0).getDate();
    const dIdx = Math.min(wDay.getIndex(), max-1);
    wDay.snapTo(dIdx, false);
  }

  function updateValue(){
    const y = years[wYear.getIndex()];
    const mIdx = wMon.getIndex();
    const dIdx = wDay.getIndex();
    const m = String(mIdx+1).padStart(2,'0');
    const d = String(dIdx+1).padStart(2,'0');
    document.getElementById('val').innerHTML =
      `Выбрано: <strong>${y}-${m}-${d}</strong>`;
  }

  const now = new Date();

  const wDay  = buildWheel(elDay,  days,   now.getDate()-1, ()=>{
    if (!ready) return;
    updateValue();
  });

  const wMon  = buildWheel(elMon,  months, now.getMonth(), ()=>{
    if (!ready) return;
    clampDay();
    updateValue();
  });

  const wYear = buildWheel(elYear, years,  25, ()=>{
    if (!ready) return;
    clampDay();
    updateValue();
  });

  // включаем реакцию на изменения только после того, как все три готовы
  ready = true;
  clampDay();
  updateValue();

  document.getElementById('send').addEventListener('click',()=>{
    const y = years[wYear.getIndex()];
    const m = String(wMon.getIndex()+1).padStart(2,'0');
    const d = String(wDay.getIndex()+1).padStart(2,'0');
    tg.sendData?.(JSON.stringify({type:"date", value:`${y}-${m}-${d}`}));
    tg.close?.();
  });

  tg.ready?.();
</script>
</body>
</html>
