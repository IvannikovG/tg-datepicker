<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Выбор даты</title>
<style>
  :root {
    --bg:#0f1115;
    --fg:#eaeef5;
    --accent:#6ee7ff;
    --muted:#7a8599;
    --ring:rgba(110,231,255,.28);
    --active-glow:rgba(110,231,255,.35);
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  }
  .wrap{
    min-height:100svh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:24px;padding:16px;
  }
  h1{font-size:18px;font-weight:600;margin:0;opacity:.92}

  .wheels{display:flex;gap:14px;align-items:center}
  .col{display:flex;flex-direction:column;align-items:center}
  .label{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}

  .wheel{
    width:110px;height:190px;padding:0 6px;
    overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;
    scroll-snap-type:y mandatory;border-radius:14px;position:relative;
    backdrop-filter:saturate(120%) blur(0.2px);
    background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));
    box-shadow:0 0 0 1px rgba(255,255,255,.05) inset,0 10px 44px rgba(0,0,0,.5);
  }
  .wheel::-webkit-scrollbar{display:none}

  .item{
    height:48px;display:flex;align-items:center;justify-content:center;
    scroll-snap-align:center;font-size:18px;color:var(--muted);
    opacity:.45;transform:scale(.95);
    transition:transform .12s linear,opacity .12s linear,
               color .12s linear,text-shadow .12s linear;
  }
  .item.active{
    color:var(--fg);opacity:1;font-weight:700;transform:scale(1.14);
    text-shadow:0 0 10px var(--active-glow),0 0 22px rgba(0,0,0,.4);
  }

  .wheel::after{
    content:"";position:absolute;left:8px;right:8px;
    top:calc(50% - 24px);height:48px;border-radius:10px;
    pointer-events:none;
    box-shadow:0 0 0 1px var(--ring),
               inset 0 -12px 34px rgba(110,231,255,.08),
               inset 0 12px 34px rgba(110,231,255,.08);
    background:linear-gradient(180deg,
               rgba(110,231,255,.16),
               rgba(110,231,255,.10));
  }

  .value{font-size:14px;color:var(--muted)}
  .btn{
    padding:14px 18px;border-radius:12px;border:none;
    font-weight:700;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#38bdf8,#8b5cf6 80%);
    box-shadow:0 10px 30px rgba(56,189,248,.35),
               0 4px 14px rgba(139,92,246,.25);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Выбери дату</h1>
  <div class="wheels">
    <div class="col">
      <div id="wheel-day" class="wheel"></div>
      <div class="label">День</div>
    </div>
    <div class="col">
      <div id="wheel-month" class="wheel"></div>
      <div class="label">Месяц</div>
    </div>
    <div class="col">
      <div id="wheel-year" class="wheel"></div>
      <div class="label">Год</div>
    </div>
  </div>
  <div class="value" id="val"></div>
  <button class="btn" id="send">Готово</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  const tg = window.Telegram.WebApp;
  const tp = tg.themeParams || {};
  const css = (k,v)=>document.documentElement.style.setProperty(k,v);
  css('--bg', tp.bg_color || '#0f1115');
  css('--fg', tp.text_color || '#eaeef5');
  css('--muted', tp.hint_color || '#7a8599');
  css('--accent', tp.button_color || '#6ee7ff');

  function wheel(el, items, selectedIdx=0){
    el.innerHTML = ['','','']
      .concat(items.map(v=>`<div class="item">${v}</div>`))
      .concat(['','','']).join('');
    const H=48;
    const itemsEls=[...el.querySelectorAll('.item')];
    const snapTop=i=>(i+3)*H-(el.clientHeight/2-H/2);
    const snapTo=i=>el.scrollTo({top:snapTop(i),behavior:'smooth'});
    const idx=()=>Math.round((el.scrollTop+el.clientHeight/2-H/2)/H)-3;
    function markActive(i){
      itemsEls.forEach((n,j)=>j===i?n.classList.add('active'):n.classList.remove('active'));
    }
    let lock=false,t;
    function onSettled(){
      const i=Math.max(0,Math.min(itemsEls.length-1,idx()));
      markActive(i);
      tg.HapticFeedback?.impactOccurred("light");
      updateValue();
    }
    el.addEventListener('scroll',()=>{
      clearTimeout(t);
      t=setTimeout(()=>{
        if(lock)return;
        lock=true;
        el.scrollTo({top:snapTop(idx()),behavior:'smooth'});
        setTimeout(()=>{lock=false;onSettled();},160);
      },80);
    });
    snapTo(selectedIdx);
    setTimeout(()=>markActive(selectedIdx),120);
    return{getIndex:idx,snapTo,markActive};
  }

  const days=Array.from({length:31},(_,i)=>String(i+1).padStart(2,'0'));
  const months=["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
  const thisYear=new Date().getFullYear();
  const years=Array.from({length:110},(_,i)=>String(thisYear-i));

  const wDay=wheel(document.getElementById('wheel-day'),days,new Date().getDate()-1);
  const wMon=wheel(document.getElementById('wheel-month'),months,new Date().getMonth());
  const wYear=wheel(document.getElementById('wheel-year'),years,25);

  function clampDay(y,mIdx){
    const max=new Date(y,mIdx+1,0).getDate();
    const i=Math.min(wDay.getIndex(),max-1);
    wDay.snapTo(i);
    setTimeout(()=>wDay.markActive(i),130);
  }
  function fmt(){
    const d=days[Math.max(0,Math.min(30,wDay.getIndex()))]||'01';
    const mIdx=Math.max(0,Math.min(11,wMon.getIndex()));
    const m=String(mIdx+1).padStart(2,'0');
    const y=years[Math.max(0,Math.min(years.length-1,wYear.getIndex()))]||String(thisYear);
    return{y,m,d,mIdx};
  }
  function updateValue(){
    const {y,m,d,mIdx}=fmt();
    clampDay(+y,mIdx);
    document.getElementById('val').textContent=`${y}-${m}-${d}`;
  }
  updateValue();

  document.getElementById('send').addEventListener('click',()=>{
    const {y,m,d}=fmt();
    tg.sendData(JSON.stringify({type:"date",value:`${y}-${m}-${d}`}));
    tg.close();
  });
  tg.ready();
</script>
</body>
</html>
